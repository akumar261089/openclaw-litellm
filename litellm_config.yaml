model_list:
  - model_name: claude-sonnet
    litellm_provider: anthropic
    model_name: claude-3-sonnet-20240229
  - model_name: gpt-4o
    litellm_provider: openai
    model_name: gpt-4o
  - model_name: gemini-pro
    litellm_provider: gemini
    model_name: gemini/pro
  - model_name: ollama-llama2
    litellm_provider: ollama
    model_name: llama2
    # Optional: set OLLAMA_API_BASE in .env if using a custom endpoint
  - model_name: openrouter-llama2
    litellm_provider: openrouter
    model_name: openrouter/llama-2-70b-chat
    # Optional: set OPENROUTER_API_KEY in .env
  - model_name: google-palm
    litellm_provider: google
    model_name: models/text-bison-001
    # Optional: set GOOGLE_API_KEY in .env (for PaLM) or use GEMINI_API_KEY for Gemini